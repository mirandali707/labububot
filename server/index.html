<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>labububot - dodecahedron</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script type="module" src="threejs-viz.js"></script>
    <script src="utils.js"></script>
    <script src="ble_setup.js"></script>
    <script src="ble_ui.js"></script>
    <script src="index.js"></script>
  </head>
  <body>
    <h1>labububot!</h1>
    <div>
      <button id="connectBleButton">connect bububot</button>
      <button id="disconnectBleButton">disconnect bububot</button>
      <p>BLE state: <strong><span id="bleState" style="color:#d13a30;">Disconnected</span></strong></p>
    </div>
    <div>
      <!-- labububot visualization  -->
      <canvas id="threeCanvas"></canvas>
      <p id="topFaceDisplay">top face: <span id="topFaceNumber">—</span></p>
      <p id="bottomFaceDisplay">bottom face: <span id="bottomFaceNumber">—</span></p>
      <button onclick="calibrateLevel()">calibrate</button>
    </div>
    <div>
      <h2>continuous modes</h2>
      <p>current mode: <span id="currentMode">none</span></p>
      <div>
        <button id="continuousRollButton" onclick="toggleContinuousRoll()">roll mode</button>
      </div>
      <div>
        <button id="gopherModeButton" onclick="toggleGopherMode()">gopher mode</button>
      </div>

      <h2>received data</h2>
      <p><span id="valueContainer">NaN</span></p>

      <h2>send to ESP32</h2>
      <input type="text" id="messageInput" placeholder="Enter message">
      <button id="sendButton">send</button>

      <h2>roll</h2>
      <div>
        <button onclick="sendRollCommand()">roll</button>
      </div>

      <h2>sweep bubu face</h2>
      <div id="sweepButtons">
        <button onclick="sendSweepCommand(1)">1</button>
        <button onclick="sendSweepCommand(2)">2</button>
        <button onclick="sendSweepCommand(3)">3</button>
        <button onclick="sendSweepCommand(4)">4</button>
        <button onclick="sendSweepCommand(5)">5</button>
        <button onclick="sendSweepCommand(6)">6</button>
        <button onclick="sendSweepCommand(7)">7</button>
        <button onclick="sendSweepCommand(8)">8</button>
        <button onclick="sendSweepCommand(9)">9</button>
        <button onclick="sendSweepCommand(10)">10</button>
        <button onclick="sendSweepCommand(11)">11</button>
        <button onclick="sendSweepCommand(12)">12</button>
      </div>
    </div>
    <div>
      <h2>tests</h2>
      <button onclick="document.location='/servo_test.html'">set servo</button>
      <button onclick="document.location='/ping.html'">ping</button>
      <button onclick="document.location='/ble_test.html'">ble</button>
    </div>
  </body>
</html>
